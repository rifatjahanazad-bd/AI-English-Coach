<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fast Phrases · Speed Sentence Building Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ================================================================
           CSS VARIABLES & RESET
           ================================================================ */
        :root {
            --font: 'Nunito', 'Fredoka', system-ui, sans-serif;
            --sky-top: #3AAFCC;
            --sky-mid: #5CC5D8;
            --sky-bot: #8ED8E4;
            --grass-green: #7BC67E;
            --grass-dark: #5DAF60;
            --bush-green: #6DBF5E;
            --bush-dark: #4EA04A;
            --sun-yellow: #FFE44D;
            --sun-orange: #FFD12B;
            --card-bg: rgba(255, 255, 255, 0.12);
            --btn-teal: #C5E8ED;
            --btn-teal-dark: #9FD4DC;
            --btn-teal-border: #8ACBD5;
            --cloud-white: #FFFFFF;
            --gold-frame: #D4A843;
            --gold-light: #F0D078;
            --score-bg: #EEEEEE;
            --text-dark: #2D3748;
            --text-muted: #607D8B;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        *:not(input):not(textarea) { user-select: none; -webkit-user-select: none; }
        html, body { height: 100%; overflow: hidden; }

        body {
            font-family: var(--font);
            background: #4A90B8;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        /* ================================================================
           GAME VIEWPORT — Rounded tablet-style container
           ================================================================ */
        .game-viewport {
            position: relative;
            width: 100%;
            max-width: 820px;
            height: 100%;
            max-height: 620px;
            border-radius: 28px;
            overflow: hidden;
            box-shadow:
                0 8px 40px rgba(0, 0, 0, 0.35),
                inset 0 0 0 4px rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
        }

        /* ================================================================
           RAINBOW TIMER BAR (top)
           ================================================================ */
        .rainbow-timer {
            height: 14px;
            display: flex;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .rainbow-timer .segment {
            flex: 1;
            transition: opacity 0.3s ease;
        }

        .rainbow-timer .seg-red { background: #EF5350; }
        .rainbow-timer .seg-orange { background: #FF9800; }
        .rainbow-timer .seg-yellow { background: #FFEB3B; }
        .rainbow-timer .seg-green { background: #66BB6A; }
        .rainbow-timer .seg-teal { background: #26C6DA; }
        .rainbow-timer .seg-blue { background: #42A5F5; }
        .rainbow-timer .seg-purple { background: #AB47BC; }

        .rainbow-timer .segment.depleted {
            opacity: 0.15;
        }

        /* ================================================================
           MAIN GAME AREA — Sky + Landscape
           ================================================================ */
        .game-scene {
            flex: 1;
            position: relative;
            background: linear-gradient(180deg, #3AAFCC 0%, #5CC5D8 35%, #8ED8E4 65%, #A8E4CC 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* ---- Landscape Elements (SVG-drawn) ---- */
        .landscape {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 140px;
            pointer-events: none;
            z-index: 0;
        }

        /* Sun */
        .sun {
            position: absolute;
            bottom: 50px;
            right: 40px;
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, #FFE44D 40%, #FFD12B 70%, transparent 72%);
            border-radius: 50%;
            z-index: 0;
            animation: sun-glow 4s ease-in-out infinite alternate;
        }

        @keyframes sun-glow {
            from { box-shadow: 0 0 30px rgba(255, 228, 77, 0.5); transform: scale(1); }
            to { box-shadow: 0 0 50px rgba(255, 228, 77, 0.7); transform: scale(1.06); }
        }

        /* ---- Score Badge (circular, left side) ---- */
        .score-badge {
            position: absolute;
            top: 18px;
            left: 18px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .score-circle {
            width: 56px;
            height: 56px;
            background: #FFFFFF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 900;
            color: var(--text-dark);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }

        .score-label {
            background: #E0E0E0;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            color: #555;
            text-align: center;
            line-height: 1.2;
        }
        .score-label .score-num {
            display: block;
            font-size: 14px;
            color: #333;
        }

        /* ---- Sound Button (right side) ---- */
        .sound-btn {
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 10;
            width: 48px;
            height: 48px;
            background: #FFFFFF;
            border: none;
            border-radius: 50%;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s;
        }
        .sound-btn:hover { transform: scale(1.08); }
        .sound-btn:active { transform: scale(0.95); }
        .sound-btn.muted { opacity: 0.5; }

        /* ---- Lives (hearts, right of score or right side) ---- */
        .lives-row {
            position: absolute;
            top: 82px;
            left: 18px;
            z-index: 10;
            display: flex;
            gap: 3px;
        }
        .lives-row .heart {
            font-size: 18px;
            transition: transform 0.3s, opacity 0.3s, filter 0.3s;
        }
        .lives-row .heart.lost {
            opacity: 0.3;
            filter: grayscale(1);
        }
        .lives-row .heart.shake {
            animation: heart-shake 0.4s ease;
        }

        @keyframes heart-shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-3px); }
            40%, 80% { transform: translateX(3px); }
        }

        /* ---- Progress Counter (bottom right) ---- */
        .progress-pill {
            position: absolute;
            bottom: 14px;
            right: 16px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.85);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 800;
            color: #555;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        /* ---- Settings (bottom left) ---- */
        .bottom-controls {
            position: absolute;
            bottom: 12px;
            left: 14px;
            z-index: 10;
            display: flex;
            gap: 6px;
        }
        .ctrl-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
            transition: transform 0.15s;
        }
        .ctrl-btn:hover { transform: scale(1.1); }
        .ctrl-btn.settings-btn { background: #E0E0E0; color: #555; }
        .ctrl-btn.flag-btn { background: #4CAF50; color: #FFF; }

        /* ================================================================
           ILLUSTRATION FRAME (Golden bordered image area)
           ================================================================ */
        .illustration-frame {
            margin-top: 16px;
            width: 280px;
            height: 200px;
            background: linear-gradient(135deg, #F0D078 0%, #D4A843 50%, #C49A38 100%);
            border-radius: 22px;
            padding: 5px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            z-index: 5;
            animation: frame-enter 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes frame-enter {
            from { transform: scale(0.8) translateY(-15px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .illustration-inner {
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #E8F4FD, #DCEEFB);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            overflow: hidden;
            position: relative;
        }

        .illustration-emoji {
            font-size: 72px;
            animation: emoji-bounce 2.5s ease-in-out infinite;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
        }

        @keyframes emoji-bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.05); }
        }

        .illustration-context {
            font-size: 13px;
            font-weight: 700;
            color: #3D6B7A;
            text-align: center;
            padding: 0 12px;
            max-width: 90%;
        }

        /* ================================================================
           CLOUD SENTENCE SLOT
           ================================================================ */
        .cloud-slot-wrapper {
            margin-top: -10px;
            z-index: 6;
            position: relative;
        }

        .cloud-slot {
            background: var(--cloud-white);
            min-width: 340px;
            max-width: 580px;
            min-height: 50px;
            padding: 10px 24px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            position: relative;
            transition: all 0.3s ease;
        }

        /* Cloud bumps */
        .cloud-slot::before,
        .cloud-slot::after {
            content: '';
            position: absolute;
            background: var(--cloud-white);
            border-radius: 50%;
        }
        .cloud-slot::before {
            width: 40px;
            height: 40px;
            top: -14px;
            left: 60px;
        }
        .cloud-slot::after {
            width: 52px;
            height: 48px;
            top: -18px;
            right: 80px;
        }

        .cloud-slot .dots {
            font-size: 20px;
            font-weight: 900;
            color: #90A4AE;
            letter-spacing: 4px;
        }

        .cloud-slot.correct {
            background: #C8E6C9;
            animation: cloud-pop 0.45s ease;
        }
        .cloud-slot.correct::before, .cloud-slot.correct::after { background: #C8E6C9; }

        .cloud-slot.wrong {
            background: #FFCDD2;
            animation: cloud-shake 0.4s ease;
        }
        .cloud-slot.wrong::before, .cloud-slot.wrong::after { background: #FFCDD2; }

        @keyframes cloud-pop {
            0% { transform: scale(0.96); }
            40% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        @keyframes cloud-shake {
            0%, 100% { transform: translateX(0); }
            15%, 55% { transform: translateX(-6px); }
            35%, 75% { transform: translateX(6px); }
        }

        .placed-word {
            background: #0288D1;
            color: #FFF;
            font-size: 16px;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 20px;
            box-shadow: 0 2px 0 #01579B;
            animation: word-pop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes word-pop {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* ================================================================
           WORD CHOICE BUTTONS
           ================================================================ */
        .word-choices {
            margin-top: 12px;
            z-index: 5;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding: 0 20px;
            max-width: 600px;
        }

        .choice-btn {
            background: var(--btn-teal);
            color: var(--text-dark);
            border: 2.5px solid var(--btn-teal-border);
            font-family: var(--font);
            font-size: 17px;
            font-weight: 700;
            padding: 12px 26px;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--btn-teal-dark), 0 5px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.1s ease;
            position: relative;
            top: 0;
        }

        .choice-btn:hover {
            top: -2px;
            box-shadow: 0 6px 0 var(--btn-teal-dark), 0 8px 14px rgba(0, 0, 0, 0.12);
            background: #D4EEF3;
        }

        .choice-btn:active {
            top: 3px;
            box-shadow: 0 1px 0 var(--btn-teal-dark);
        }

        .choice-btn.used {
            opacity: 0.2;
            pointer-events: none;
            box-shadow: none;
            top: 0;
            transform: scale(0.9);
        }

        .choice-btn.wrong-flash {
            animation: btn-shake 0.35s ease;
            background: #FFCDD2;
            border-color: #EF9A9A;
        }

        @keyframes btn-shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }

        /* ================================================================
           SCORE POPUP
           ================================================================ */
        .score-popup {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            font-weight: 900;
            color: #FF9800;
            text-shadow: 0 3px 8px rgba(0, 0, 0, 0.25), 0 0 20px rgba(255, 152, 0, 0.4);
            z-index: 50;
            pointer-events: none;
            animation: score-fly 0.9s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        @keyframes score-fly {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            25% { transform: translate(-50%, -70%) scale(1.3); opacity: 1; }
            100% { transform: translate(-50%, -140%) scale(0.7); opacity: 0; }
        }

        /* ================================================================
           CONFETTI
           ================================================================ */
        .confetti-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 100;
            overflow: hidden;
        }
        .confetti {
            position: absolute;
            border-radius: 3px;
            animation: confetti-fall linear forwards;
        }
        @keyframes confetti-fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(700px) rotate(720deg); opacity: 0; }
        }

        /* ================================================================
           OVERLAY SCREENS (Menu & Game Over)
           ================================================================ */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(30, 80, 100, 0.88);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 200;
            overflow-y: auto;
        }
        .overlay.hidden { display: none !important; }

        .modal-card {
            background: #FFFFFF;
            border-radius: 28px;
            max-width: 460px;
            width: 100%;
            padding: 28px 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            border: 4px solid var(--btn-teal-border);
            animation: modal-pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modal-pop {
            from { transform: scale(0.75) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .modal-card .game-logo { font-size: 50px; margin-bottom: 4px; }
        .modal-card h1 {
            font-size: 30px;
            font-weight: 900;
            color: var(--sky-top);
            margin-bottom: 2px;
        }
        .modal-card .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 16px;
            font-weight: 600;
        }

        /* Category buttons in menu */
        .cat-grid {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-bottom: 16px;
            max-height: 240px;
            overflow-y: auto;
            padding: 2px 4px;
        }
        .cat-grid::-webkit-scrollbar { width: 4px; }
        .cat-grid::-webkit-scrollbar-track { background: transparent; }
        .cat-grid::-webkit-scrollbar-thumb { background: #B0BEC5; border-radius: 10px; }

        .cat-btn {
            background: #F5F5F5;
            border: 2px solid #E0E0E0;
            border-radius: 16px;
            padding: 11px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s ease;
            font-family: var(--font);
        }
        .cat-btn:hover {
            border-color: var(--sky-top);
            background: #E0F7FA;
            transform: translateX(3px);
        }
        .cat-btn.selected {
            border-color: var(--sky-top);
            background: #E0F7FA;
            box-shadow: inset 0 0 0 2px rgba(58, 175, 204, 0.15);
        }
        .cat-btn .cat-emoji { font-size: 26px; flex-shrink: 0; }
        .cat-btn .cat-meta h4 { font-size: 14px; color: var(--text-dark); font-weight: 700; }
        .cat-btn .cat-meta span { font-size: 11px; color: var(--text-muted); font-weight: 600; }

        /* Big Play Button */
        .btn-play {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #FF9800, #F57C00);
            color: #FFF;
            border: none;
            font-family: var(--font);
            font-size: 20px;
            font-weight: 900;
            padding: 14px 32px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #E65100, 0 8px 20px rgba(230, 81, 0, 0.3);
            transition: all 0.12s ease;
            position: relative;
            top: 0;
            letter-spacing: 0.5px;
        }
        .btn-play:hover { top: -2px; box-shadow: 0 7px 0 #E65100, 0 12px 28px rgba(230, 81, 0, 0.35); }
        .btn-play:active { top: 4px; box-shadow: 0 1px 0 #E65100; }

        /* Game Over panel */
        .results-panel {
            background: #F5F7FA;
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 16px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 0;
        }
        .result-row:not(:last-child) { border-bottom: 1px solid #E0E7EE; }
        .result-row .label { font-size: 14px; font-weight: 700; color: var(--text-muted); }
        .result-row .value { font-size: 17px; font-weight: 900; }
        .result-row .value.score { color: #0288D1; }
        .result-row .value.streak { color: #FF9800; }
        .result-row .value.accuracy { color: #4CAF50; }

        .rank-badge {
            font-size: 16px;
            font-weight: 800;
            color: #E65100;
            margin-bottom: 12px;
        }

        /* ================================================================
           STREAK / MULTIPLIER POPUP
           ================================================================ */
        .streak-popup {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 152, 0, 0.92);
            color: #FFF;
            padding: 5px 18px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 900;
            z-index: 50;
            animation: streak-show 1.5s ease forwards;
            pointer-events: none;
        }
        @keyframes streak-show {
            0% { transform: translateX(-50%) scale(0.6); opacity: 0; }
            20% { transform: translateX(-50%) scale(1.1); opacity: 1; }
            80% { transform: translateX(-50%) scale(1); opacity: 1; }
            100% { transform: translateX(-50%) translateY(-10px); opacity: 0; }
        }

        /* ================================================================
           RESPONSIVE
           ================================================================ */
        @media (max-width: 600px) {
            .game-viewport { border-radius: 18px; max-height: 100%; }
            .illustration-frame { width: 220px; height: 160px; }
            .illustration-emoji { font-size: 52px; }
            .cloud-slot { min-width: 280px; padding: 8px 18px; }
            .choice-btn { font-size: 15px; padding: 10px 18px; }
            .score-circle { width: 46px; height: 46px; font-size: 17px; }
        }

        @media (max-height: 560px) {
            .illustration-frame { width: 200px; height: 140px; margin-top: 8px; }
            .illustration-emoji { font-size: 44px; }
            .cloud-slot-wrapper { margin-top: -6px; }
            .word-choices { margin-top: 8px; }
        }
    </style>
</head>
<body>

    <div class="game-viewport" id="gameViewport">

        <!-- RAINBOW TIMER -->
        <div class="rainbow-timer" id="rainbowTimer">
            <div class="segment seg-red"></div>
            <div class="segment seg-orange"></div>
            <div class="segment seg-yellow"></div>
            <div class="segment seg-green"></div>
            <div class="segment seg-teal"></div>
            <div class="segment seg-blue"></div>
            <div class="segment seg-purple"></div>
        </div>

        <!-- MAIN GAME SCENE -->
        <div class="game-scene" id="gameScene">

            <!-- LANDSCAPE (SVG hills + grass + bushes + sun) -->
            <svg class="landscape" viewBox="0 0 820 140" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Far hills -->
                <ellipse cx="200" cy="140" rx="280" ry="80" fill="#8EC78F" opacity="0.6"/>
                <ellipse cx="620" cy="140" rx="320" ry="90" fill="#7BBC7D" opacity="0.5"/>
                <!-- Grass base -->
                <rect x="0" y="95" width="820" height="50" fill="#5DAF60"/>
                <rect x="0" y="100" width="820" height="45" fill="#4EA04A"/>
                <!-- Bushes -->
                <circle cx="80" cy="98" r="28" fill="#6DBF5E"/>
                <circle cx="120" cy="95" r="22" fill="#7BC67E"/>
                <circle cx="50" cy="100" r="20" fill="#5DAF60"/>
                <circle cx="300" cy="96" r="25" fill="#6DBF5E"/>
                <circle cx="340" cy="98" r="20" fill="#7BC67E"/>
                <circle cx="520" cy="95" r="30" fill="#5DAF60"/>
                <circle cx="560" cy="97" r="22" fill="#6DBF5E"/>
                <circle cx="700" cy="96" r="26" fill="#7BC67E"/>
                <circle cx="740" cy="99" r="20" fill="#5DAF60"/>
                <!-- Grass blades -->

    <script>
    // ==================================================================
    // AUDIO ENGINE
    // ==================================================================
    const Audio = (() => {
        let ctx = null;
        let muted = false;

        const init = () => { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); };

        const play = (type) => {
            if (muted) return;
            init();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            const t = ctx.currentTime;

            switch (type) {
                case 'click':
                    osc.frequency.setValueAtTime(520, t);
                    osc.frequency.exponentialRampToValueAtTime(700, t + 0.04);
                    gain.gain.setValueAtTime(0.12, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
                    osc.start(t); osc.stop(t + 0.06);
                    break;
                case 'place':
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, t);
                    osc.frequency.exponentialRampToValueAtTime(880, t + 0.06);
                    gain.gain.setValueAtTime(0.1, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
                    osc.start(t); osc.stop(t + 0.1);
                    break;
                case 'correct':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523, t);
                    osc.frequency.setValueAtTime(659, t + 0.1);
                    osc.frequency.setValueAtTime(784, t + 0.2);
                    osc.frequency.setValueAtTime(1047, t + 0.3);
                    gain.gain.setValueAtTime(0.18, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
                    osc.start(t); osc.stop(t + 0.45);
                    break;
                case 'wrong':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, t);
                    osc.frequency.exponentialRampToValueAtTime(90, t + 0.2);
                    gain.gain.setValueAtTime(0.18, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
                    osc.start(t); osc.stop(t + 0.25);
                    break;
                case 'gameover':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, t);
                    osc.frequency.setValueAtTime(349, t + 0.15);
                    osc.frequency.setValueAtTime(293, t + 0.3);
                    osc.frequency.setValueAtTime(220, t + 0.45);
                    gain.gain.setValueAtTime(0.18, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
                    osc.start(t); osc.stop(t + 0.6);
                    break;
            }
        };

        return {
            play,
            toggle: () => { muted = !muted; return muted; },
            isMuted: () => muted
        };
    })();

    // ==================================================================

            el.className = 'confetti';
            el.style.left = Math.random()*100+'%';
            el.style.background = colors[Math.floor(Math.random()*colors.length)];
            el.style.width = (5+Math.random()*6)+'px';
            el.style.height = (5+Math.random()*6)+'px';
            el.style.animationDuration = (1.5+Math.random()*1.5)+'s';

        "comparatives": {

            desc: "Bigger, better, the best & more",
            items: [
                { context: "An elephant is bigger than a mouse", emoji: "🐘", chunks: ["An elephant", "is bigger", "than a mouse."] },
                { context: "This is the tallest building in the city", emoji: "🏙️", chunks: ["This is", "the tallest building", "in the city."] },
                { context: "Pizza is more popular than salad", emoji: "🍕", chunks: ["Pizza", "is more popular", "than salad."] },
                { context: "She runs faster than her older brother", emoji: "🏃", chunks: ["She", "runs faster", "than her brother."] },
                { context: "This is the most beautiful garden I have seen", emoji: "🌺", chunks: ["This is", "the most beautiful", "garden."] },
                { context: "A cheetah is the fastest land animal", emoji: "🐆", chunks: ["A cheetah", "is the fastest", "land animal."] },
                { context: "Math is harder than art for some students", emoji: "🧮", chunks: ["Math", "is harder", "than art."] },

    // ==================================================================
    // GAME STATE
    // ==================================================================
    let G = {
        cat: 'present', deck: [], cur: null,
        score: 0, streak: 0, maxStreak: 0, lives: 3,
        total: 0, correct: 0,
        placed: [], remaining: [],
        timer: null, totalTime: 12, timeLeft: 12,
        questionNum: 0, totalQuestions: 20,
        playing: false
    };

    // ==================================================================
    // DOM REFS
    // ==================================================================
    const $ = id => document.getElementById(id);
    const rainbowTimer = $('rainbowTimer');
    const segments = rainbowTimer.querySelectorAll('.segment');
    const streakCircle = $('streakCircle');
    const scoreNum = $('scoreNum');
    const livesRow = $('livesRow');
    const sceneEmoji = $('sceneEmoji');
    const sceneContext = $('sceneContext');
    const cloudSlot = $('cloudSlot');
    const wordChoices = $('wordChoices');
    const progressPill = $('progressPill');
    const illustrationFrame = $('illustrationFrame');
    const menuOverlay = $('menuOverlay');
    const gameOverOverlay = $('gameOverOverlay');
    const catGrid = $('catGrid');
    const soundBtn = $('soundBtn');

    // ==================================================================
    // CATEGORY MENU
    // ==================================================================
    function buildMenu() {
        catGrid.innerHTML = '';
        Object.entries(CATEGORIES).forEach(([key, cat], i) => {
            const b = document.createElement('button');
            b.className = `cat-btn ${i===0?'selected':''}`;
            b.dataset.key = key;
            b.innerHTML = `<span class="cat-emoji">${cat.emoji}</span><div class="cat-meta"><h4>${cat.title}</h4><span>${cat.desc}</span></div>`;
            b.addEventListener('click', () => {
                catGrid.querySelectorAll('.cat-btn').forEach(x => x.classList.remove('selected'));
                b.classList.add('selected');
                G.cat = key;
                Audio.play('click');
            });
            catGrid.appendChild(b);
        });
    }

    // ==================================================================
    // LIVES
    // ==================================================================
    function renderLives(shake = false) {
        livesRow.innerHTML = '';
        for (let i = 0; i < 3; i++) {
            const s = document.createElement('span');
            s.className = 'heart';
            s.textContent = '❤️';
            if (i >= G.lives) s.classList.add('lost');
            if (shake && i < G.lives) s.classList.add('shake');
            livesRow.appendChild(s);
        }
    }

    // ==================================================================
    // STATS
    // ==================================================================
    function updateStats() {
        scoreNum.textContent = G.score;
        streakCircle.textContent = G.streak;
        progressPill.textContent = `${G.questionNum}/${G.totalQuestions}`;
    }

    // ==================================================================
    // RAINBOW TIMER
    // ==================================================================
    function getTime() {
        if (G.streak >= 10) return 4.5;
        if (G.streak >= 8) return 5.5;
        if (G.streak >= 5) return 7;
        if (G.streak >= 3) return 9;
        return 12;
    }

    function startTimer() {
        clearInterval(G.timer);
        G.totalTime = getTime();
        G.timeLeft = G.totalTime;
        segments.forEach(s => s.classList.remove('depleted'));

        const tick = 40;
        G.timer = setInterval(() => {
            G.timeLeft -= tick / 1000;
            const pct = Math.max(0, G.timeLeft / G.totalTime);

            // Deplete segments from right to left
            const totalSegs = segments.length;
            const activeSegs = Math.ceil(pct * totalSegs);
            segments.forEach((s, i) => {
                if (i >= activeSegs) s.classList.add('depleted');
                else s.classList.remove('depleted');
            });

            if (G.timeLeft <= 0) {
                clearInterval(G.timer);
                handleTimeout();
            }
        }, tick);
    }

    // ==================================================================
    // GAME FLOW
    // ==================================================================
    function startGame() {
        menuOverlay.classList.add('hidden');
        gameOverOverlay.classList.add('hidden');

        G.score = 0; G.streak = 0; G.maxStreak = 0; G.lives = 3;
        G.total = 0; G.correct = 0; G.questionNum = 0;
        G.playing = true;

        const items = CATEGORIES[G.cat].items;
        // Duplicate + shuffle for ~20 questions
        G.deck = [...items, ...items].sort(() => Math.random() - 0.5);
        G.totalQuestions = G.deck.length;

        updateStats();
        renderLives();
        nextRound();
    }

    function nextRound() {
        if (G.lives <= 0 || G.deck.length === 0) { endGame(); return; }

        G.cur = G.deck.pop();
        G.placed = [];
        G.remaining = [...G.cur.chunks];
        G.questionNum++;

        // Update illustration
        sceneEmoji.textContent = G.cur.emoji;
        sceneContext.textContent = G.cur.context;
        illustrationFrame.style.animation = 'none';
        void illustrationFrame.offsetHeight;
        illustrationFrame.style.animation = '';

        // Reset cloud slot
        cloudSlot.className = 'cloud-slot';
        cloudSlot.innerHTML = '<span class="dots">···  ···</span>';

        // Scramble word choices
        const scrambled = [...G.cur.chunks].sort(() => Math.random() - 0.5);
        wordChoices.innerHTML = '';
        scrambled.forEach(chunk => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.textContent = chunk;
            btn.addEventListener('click', () => onWordClick(btn, chunk));
            wordChoices.appendChild(btn);
        });

        updateStats();
        startTimer();
    }

    function onWordClick(btn, chunk) {
        Audio.play('place');
        const expected = G.remaining[0];

        if (chunk === expected) {
            btn.classList.add('used');
            G.remaining.shift();
            G.placed.push(chunk);

            // Update cloud slot
            cloudSlot.innerHTML = '';
            G.placed.forEach(w => {
                const pill = document.createElement('span');
                pill.className = 'placed-word';
                pill.textContent = w;
                cloudSlot.appendChild(pill);
            });
            // Add remaining dots
            if (G.remaining.length > 0) {
                const dots = document.createElement('span');
                dots.className = 'dots';
                dots.textContent = '···'.repeat(G.remaining.length);
                dots.style.marginLeft = '4px';
                cloudSlot.appendChild(dots);
            }

            // Complete!
            if (G.remaining.length === 0) {
                clearInterval(G.timer);
                handleSuccess();
            }
        } else {
            btn.classList.add('wrong-flash');
            setTimeout(() => btn.classList.remove('wrong-flash'), 400);
            handleMistake();
        }
    }

    function handleSuccess() {
        Audio.play('correct');
        cloudSlot.classList.add('correct');

        G.streak++;
        if (G.streak > G.maxStreak) G.maxStreak = G.streak;
        G.total++; G.correct++;

        let mult = G.streak >= 9 ? 4 : (G.streak >= 6 ? 3 : (G.streak >= 3 ? 2 : 1));
        const speed = Math.max(0.3, G.timeLeft / G.totalTime);
        const pts = Math.round(120 * mult * speed);
        G.score += pts;

        updateStats();
        renderLives();
        showScorePopup(pts);
        showStreakPopup(G.streak);
        spawnConfetti(18);

        setTimeout(nextRound, 1100);
    }

    function handleMistake() {
        Audio.play('wrong');
        cloudSlot.classList.add('wrong');
        G.lives--; G.streak = 0; G.total++;
        updateStats();
        renderLives(true);

        setTimeout(() => {
            cloudSlot.classList.remove('wrong');
            if (G.lives <= 0) { clearInterval(G.timer); endGame(); }
        }, 600);
    }

    function handleTimeout() {
        Audio.play('wrong');
        cloudSlot.classList.add('wrong');
        G.lives--; G.streak = 0; G.total++;
        updateStats();
        renderLives(true);

        // Show correct answer
        cloudSlot.innerHTML = '';
        G.cur.chunks.forEach(w => {
            const pill = document.createElement('span');
            pill.className = 'placed-word';
            pill.style.background = '#EF5350';
            pill.style.boxShadow = '0 2px 0 #C62828';
            pill.textContent = w;
            cloudSlot.appendChild(pill);
        });

        setTimeout(() => {
            if (G.lives <= 0) endGame();
            else nextRound();
        }, 1200);
    }

    function endGame() {
        clearInterval(G.timer);
        G.playing = false;
        Audio.play('gameover');

        const acc = G.total > 0 ? Math.round((G.correct / G.total) * 100) : 0;
        $('finalScore').textContent = G.score;
        $('finalStreak').textContent = `${G.maxStreak} 🔥`;
        $('finalAccuracy').textContent = `${acc}%`;
        $('finalQuestions').textContent = `${G.correct} / ${G.total}`;

        let rank = '📚 Sentence Beginner';
        if (G.score >= 2000) rank = '👑 Fast Phrases Grandmaster!';
        else if (G.score >= 1200) rank = '⚡ Speed Sentence Champion!';
        else if (G.score >= 600) rank = '🌟 Fluency Builder';
        else if (G.score >= 300) rank = '🌱 Grammar Learner';
        $('rankText').textContent = rank;

        gameOverOverlay.classList.remove('hidden');
        if (G.score >= 600) spawnConfetti(40);
    }

    // ==================================================================
    // EVENT LISTENERS
    // ==================================================================
    $('btnStart').addEventListener('click', () => { Audio.play('click'); startGame(); });
    $('btnRestart').addEventListener('click', () => {
        Audio.play('click');
        gameOverOverlay.classList.add('hidden');
        menuOverlay.classList.remove('hidden');
    });

    soundBtn.addEventListener('click', () => {
        const m = Audio.toggle();
        soundBtn.textContent = m ? '🔇' : '🔊';
        soundBtn.classList.toggle('muted', m);
    });

    document.querySelector('.flag-btn').addEventListener('click', () => {
        if (G.playing) {
            clearInterval(G.timer);
            G.playing = false;
        }
        menuOverlay.classList.remove('hidden');
        gameOverOverlay.classList.add('hidden');
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            if (!menuOverlay.classList.contains('hidden')) { Audio.play('click'); startGame(); }
            else if (!gameOverOverlay.classList.contains('hidden')) {
                Audio.play('click');
                gameOverOverlay.classList.add('hidden');
                menuOverlay.classList.remove('hidden');
            }
        }
    });

    // ==================================================================
    // INIT
    // ==================================================================
    buildMenu();
    </script>
</body>
</html>
